<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Original Engineering Candidate Product Revision R0.1</title>
</head>
<body>
  <h1>Original Engineering Candidate Product Revision R0.1</h1>
  <p>This tool will create the canonical engineering product record and immutable revision.</p>
  <button id="createRecord">Create Canonical Engineering Product Record</button>
  <button id="createRevision">Create Immutable Revision</button>

  <script src="../shared/shared.js"></script>
  <script src="./tool.js"></script>
  <script>
    document.getElementById('createRecord').addEventListener('click', () => {
      window.tool.createCanonicalEngineeringProductRecord();
    });

    document.getElementById('createRevision').addEventListener('click', () => {
      window.tool.createImmutableRevision();
    });
  </script>
</body>
</html>
