<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SkillHex Capability Graph — Decide Engine Studio</title>
  <script src="../../shared/vd-nav-fix.js"></script>
  <script src="../../engine/systems/entity-manager.js"></script>
  <script src="../../engine/systems/component-registry.js"></script>
  <script src="../../engine/systems/system-runner.js"></script>
  <script src="../../engine/systems/entity-system.js"></script>
  <script src="../../engine/runtime/simulation-loop.js"></script>
  <script src="../../engine/core/asset-loader.js"></script>
  <script src="../../engine/core/game-loader.js"></script>
  <script src="../../engine/ui-orchestrator.js"></script>
  <script src="../../engine/core/engine-core.js"></script>
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #120f1c; color: #f5eaff; }
    .shell { max-width: 900px; margin: 0 auto; padding: 24px; }
    .controls { display: flex; gap: 8px; margin: 12px 0; }
    button { background: #2a1d40; color: #fff; border: 1px solid #5f4692; border-radius: 8px; padding: 8px 12px; cursor: pointer; }
    .panel { background: #1a1427; border: 1px solid #48356f; border-radius: 10px; padding: 16px; }
  </style>
  <link rel="manifest" href="manifest.json">
  <script src="pwa.js" defer></script>
</head>
<body>
  <div class="shell">
    <h1>SkillHex Capability Graph</h1>
    <p id="engine-status">Initializing…</p>
    <div class="controls">
      <button id="start-btn">Start</button>
      <button id="pause-btn">Pause</button>
      <button id="reset-btn">Reset</button>
      <a href="../index.html" style="color:#c9a7ff;align-self:center">Back to launcher</a>
    </div>
    <div id="engine-game-host" class="panel"></div>
  </div>
  <script>
    document.addEventListener('DOMContentLoaded', async () => {
      // ---- Explorer Pass: Onboarding Bypass ----
      (function checkExplorerPass() {
        const params = new URLSearchParams(window.location.search);
        const fromQR = params.get('via_source') === 'smarttag-qr';
        const fromLS = localStorage.getItem('via_auth_source') === 'smarttag-qr';

        if (fromQR) {
          try {
            localStorage.setItem('via_auth_source', 'smarttag-qr');
            localStorage.setItem('via_explorer_pass', 'active');
          } catch(e) {}
          const clean = new URL(window.location.href);
          clean.searchParams.delete('via_source');
          window.history.replaceState({}, '', clean.toString());
        }

        if (fromQR || fromLS) {
          document.getElementById('engine-status').textContent =
            'Explorer Pass Active — Loading SkillHex...';
          console.log('✅ SkillHex: Explorer Pass detected. Onboarding bypassed.');
        }
      })();

      await window.EngineCore.loadGame('skillhex');
      document.getElementById('start-btn').addEventListener('click', () => window.EngineCore.startSimulation('skillhex'));
      document.getElementById('pause-btn').addEventListener('click', () => window.EngineCore.pauseSimulation('skillhex'));
      document.getElementById('reset-btn').addEventListener('click', () => window.EngineCore.resetSimulation('skillhex'));
    });
  </script>

  <button id="pwa-install-btn" class="hidden" style="display:none; position:fixed; bottom:20px; right:20px; z-index:9999; padding:10px 20px; background:#ff2a2a; color:#fff; border:none; border-radius:5px; cursor:pointer; font-weight:bold; box-shadow:0 4px 10px rgba(0,0,0,0.5);">Install App</button>
</body>
</html>
